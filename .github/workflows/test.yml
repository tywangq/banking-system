name: Run unit tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.8
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: psql
          POSTGRES_DB: bank
        options: >-
          --health-cmd "pg_isready -U root -d bank"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.2"

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.14.1/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate.linux-amd64 /usr/bin/migrate
          which migrate

      - name: Run migrations
        run: make migrateup

      # app.env is not in the repo, so the config comes from the environment.
      # These are throwaway values for the service container above, not secrets.
      - name: Test
        run: make test
        env:
          ENVIRONMENT: test
          DB_DRIVER: postgres
          DB_SOURCE: postgresql://root:psql@localhost:5432/bank?sslmode=disable
          MIGRATION_URL: file://db/migration
          HTTP_SERVER_ADDRESS: 0.0.0.0:8080
          GRPC_SERVER_ADDRESS: 0.0.0.0:9090
          TOKEN_SYMMETRIC_KEY: 12345678901234567890123456789012
          ACCESS_TOKEN_DURATION: 15m
          REFRESH_TOKEN_DURATION: 24h
