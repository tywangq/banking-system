apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api-deployment
  labels:
    app: bank-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bank-api
  template:
    metadata:
      labels:
        app: bank-api
    spec:
      containers:
        - name: bank-api
          image: 875827703359.dkr.ecr.us-east-1.amazonaws.com/bank:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # The image no longer carries app.env, so every config key comes from
          # here. The deploy workflow syncs this Secret from AWS Secrets Manager
          # before applying the deployment.
          envFrom:
            - secretRef:
                name: bank-api-config
